; Firmware unit SEBAT (ESP32 + Arduino).
;   pio run                 kompilasi
;   pio run -t upload       unggah
;   pio device monitor      konsol serial (perintah: ketik "help")
; Logika kendali ada di lib/sebat_core dan diuji di komputer: host_tests/run.sh

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Wall -Wextra -Wno-unused-parameter
lib_deps =
    robtillaart/INA226@^0.6.0
    adafruit/Adafruit TSL2591 Library@^1.4.5
    adafruit/Adafruit ADS1X15@^2.5.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    256dpi/MQTT@^2.5.2
