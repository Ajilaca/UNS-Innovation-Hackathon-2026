# Opsi simulasi di dashboard. Tiap opsi menunjuk satu skenario di config/scenarios/.
presets:
  A: {scenario: cerah-umkm-kecil, name: "Hari cerah", description: "Limbah ringan, matahari cukup. Kondisi paling mudah."}
  B: {scenario: hibrida-mendung, name: "Hari mendung", description: "Surya kurang, PLN menambal saat perlu."}
  C: {scenario: kondisi-sulit, name: "Kondisi sulit", description: "Pewarna membandel, limbah pekat, dan sensor agak kotor."}
# Otomatis: tiap batch memilih salah satu opsi di atas menurut bobot ini.
auto:
  name: "Otomatis"
  description: "Sistem memilih A, B, atau C untuk tiap batch secara acak."
  weights: {A: 0.5, B: 0.3, C: 0.2}
